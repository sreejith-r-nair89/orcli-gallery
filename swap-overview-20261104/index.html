<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Person Swap Overview — Kontext Pool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px;
    background: #141517; color: #e8e8e8;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: #9a9a9a; font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
    gap: 20px;
    max-width: 1800px; margin: 0 auto;
  }
  .card {
    background: #1d1f22; border: 1px solid #2c2f33;
    border-radius: 10px; overflow: hidden;
  }
  .pair { display: flex; gap: 2px; }
  .pair figure { margin: 0; flex: 1; min-width: 0; }
  .pair img { width: 100%; height: auto; display: block; }
  .pair figcaption {
    text-align: center; font-size: 12px; padding: 8px 4px;
    color: #bdbdbd; background: #232527;
  }
  .pair figcaption b { color: #e8e8e8; font-weight: 600; }
  .tag {
    display: inline-block; font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    margin-right: 6px;
  }
  .tag.ref { background: #3a3d42; color: #cfcfcf; }
  .tag.gen { background: #1f4d33; color: #7fd6a4; }
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <h1>Person Swap — Reference vs Generated</h1>
  <p class="sub">Flux.1 Kontext (fp8) &middot; realism LoRA &middot; guidance 2.0 &middot; pass1 denoise 1.0 + pass2 1.2&times; @ 0.4 &middot; per-image randomized appearance prompts</p>
  <div class="grid" id="grid"></div>

<script>
  const ids = [1, 3, 4, 5, 6, 7, 8, 9, 11, 12];
  const grid = document.getElementById('grid');
  for (const id of ids) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="pair">
        <figure>
          <img src="images/ref_${id}.png" alt="reference ${id}" loading="lazy">
          <figcaption><span class="tag ref">Reference</span><b>${id}.png</b></figcaption>
        </figure>
        <figure>
          <img src="images/gen_${id}.png" alt="generated ${id}" loading="lazy">
          <figcaption><span class="tag gen">Generated</span><b>swap_${id}</b></figcaption>
        </figure>
      </div>`;
    grid.appendChild(card);
  }
</script>
</body>
</html>
